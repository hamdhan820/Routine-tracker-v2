name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: mkdir -p www && cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png www/
      - run: npx cap add android
      - name: Icons and alarm code
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}; mkdir -p $R/mipmap-$d
            cp ic_$s.png $R/mipmap-$d/ic_launcher.png
            cp ic_$s.png $R/mipmap-$d/ic_launcher_round.png
          done
          J=android/app/src/main/java/com/mydaily/tracker
          mkdir -p $J
          cp AlarmPlugin.java AlarmReceiver.java AlarmActivity.java MainActivity.java $J/
          python3 patch_manifest.py
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
