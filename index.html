<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c7b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>My Daily Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f4;--card:#fff;--ink:#14232b;--mut:#62767f;--ac:#0e7c7b;--ac2:#d98e04;--bad:#b4474f;--ln:#d7e0e4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1f;--card:#17262d;--ink:#e6eef1;--mut:#8fa5ae;--ac:#3cc4c2;--ac2:#f0b13a;--bad:#e5737b;--ln:#26383f}}
:root[data-theme="dark"]{--bg:#0f1a1f;--card:#17262d;--ink:#e6eef1;--mut:#8fa5ae;--ac:#3cc4c2;--ac2:#f0b13a;--bad:#e5737b;--ln:#26383f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:70px}
main{max-width:560px;margin:auto;padding:12px}
h1{font-size:22px;margin:4px 0}h2{font-size:17px;margin:14px 0 6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:8px 0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.sum b{display:block;font-size:19px}.sum span{color:var(--mut);font-size:12px}
.it{display:flex;gap:10px;border-left:4px solid var(--ln)}.it.done{border-left-color:var(--ac);opacity:.8}.it.late{border-left-color:var(--ac2)}.it.prog{border-left-color:var(--ac2);background:color-mix(in srgb,var(--ac2) 12%,var(--card))}.it.skip,.it.miss{border-left-color:var(--bad);opacity:.7}.it.resched{border-left-color:#7b6cd9;opacity:.65}
.tm{width:62px;flex:none;font-size:12px;color:var(--mut)}.bd{flex:1;min-width:0}.nm{font-weight:600}.sub{font-size:12.5px;color:var(--mut)}
.chip{float:right;font-size:18px;background:none;border:0;padding:0 2px}
.acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.b{border:1px solid var(--ln);background:var(--bg);border-radius:9px;padding:5px 9px;font-size:13px}.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.hist{font-size:12px;color:#7b6cd9;margin-top:4px}
.tab{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab button{flex:1;border:0;background:none;padding:10px 0;font-size:12px;color:var(--mut)}.tab button.on{color:var(--ac);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:28px;box-shadow:0 4px 12px #0004}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.mo{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow:auto}
label{display:block;font-size:12.5px;color:var(--mut);margin-top:8px}
input,select{width:100%;padding:9px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
.dys{display:flex;gap:4px}.dys label{flex:1;margin:0;text-align:center;border:1px solid var(--ln);border-radius:8px;padding:6px 0;color:var(--ink)}.dys input{display:none}.dys label:has(input:checked){background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.grid div{padding:8px 0;border-radius:8px;font-size:13px;background:var(--bg)}
.row{display:flex;justify-content:space-between;padding:4px 0}
.bar2{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--ac)}
.wk{overflow-x:auto}table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}td,th{border:1px solid var(--ln);text-align:center;padding:7px 3px}td.n{text-align:left;font-weight:600;min-width:120px}td.t{font-size:10px;color:var(--mut);width:58px}.cl{font-size:17px;cursor:pointer}
</style></head><body><main id="m"></main><button class="fab" id="fab" onclick="editAct()">+</button>
<nav class="tab"><button data-v="today">📅<br>Today</button><button data-v="week">▦<br>Week</button><button data-v="cal">🗓<br>Calendar</button><button data-v="stats">📊<br>Stats</button><button data-v="set">⚙️<br>Settings</button></nav>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,+b-1,+c)};
const mm=t=>{const[h,m]=t.split(':');return +h*60+ +m},f12=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+pad(m)+' '+(h<12?'AM':'PM')};
const dur=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':''):m+'m'};
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const CAT={study:'📚 Study',prayer:'🕌 Prayer',food:'🍽 Food',sleep:'😴 Sleep',quran:'📖 Qur\'an',class:'🏫 Class',health:'💪 Health',personal:'🏠 Personal',work:'💼 Work',other:'⭐ Other'};
const IC=Object.fromEntries(Object.keys(CAT).map(k=>[k,CAT[k].split(' ')[0]]));
const ST={todo:'○',prog:'⏳',done:'✓',late:'🕐',skip:'⏭',miss:'✗',resched:'↪'};
const ALL=[0,1,2,3,4,5,6],today=ymd(new Date());
let S,cur=today,view='today';
function seed(){const a=[],t=ymd(new Date());let i=0;const add=(name,cat,s,e,rem)=>a.push({id:'a'+i++,name,cat,date:t,s,e:e||'',rem:rem,rep:ALL,pri:'normal',notes:''});
add('Wake up','sleep','03:00',0,0);[['Fajr','04:55'],['Dhuhr','13:00'],['Asr','16:30'],['Maghrib','18:00'],['Isha','19:30']].forEach(p=>add(p[0],'prayer',p[1],0,5));
add('Breakfast','food','07:30','08:00',0);add('Lunch','food','13:30','14:00',0);add('Dinner','food','20:00','20:30',0);add('Study Biology','study','09:00','10:00',10);add("Qur'an",'quran','21:00','22:00',10);add('Sleep','sleep','22:30',0,0);
return{acts:a.map(x=>({...x,e:x.e||''})),rec:{},fired:{},set:{theme:'sys',rem:10}}}
try{S=JSON.parse(localStorage.getItem('mdt'))}catch(e){}
if(!S||!S.acts)S=seed();
const save=()=>{try{localStorage.setItem('mdt',JSON.stringify(S))}catch(e){}clearTimeout(window._ns);window._ns=setTimeout(nativeSync,800)};
function applyTheme(){const t=S.set.theme;if(t==='sys')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
function items(dt){const dw=pd(dt).getDay();return S.acts.filter(a=>(a.rep&&a.rep.length?a.rep.includes(dw)&&a.date<=dt:a.date===dt)&&!(a.xd||[]).includes(dt)).map(a=>{const r=(S.rec[dt]||{})[a.id]||{};return{a,r,s:r.s||a.s,e:r.e!==undefined?r.e:a.e}}).sort((x,y)=>mm(x.s)-mm(y.s))}
function R(dt,id){return((S.rec[dt]=S.rec[dt]||{})[id]=S.rec[dt][id]||{st:'todo',h:[]})}
const secs=r=>(r.secs||0)+(r.t0?(Date.now()-r.t0)/1000:0);
function mins(x){const r=x.r;if(r.secs)return secs(r)/60;if(r.st==='done'||r.st==='late'){const e=x.e||'';return e?mm(e)-mm(x.s):0}return 0}
function dayStats(dt){const L=items(dt).filter(x=>x.r.st!=='resched'),d=L.filter(x=>['done','late'].includes(x.r.st)),o={tot:L.length,done:d.length,study:0,pr:0,prT:0,meal:0,mealT:0,q:0,rs:0,sk:0,subj:{}};
L.forEach(x=>{const c=x.r.rc||x.a.cat,ok=['done','late'].includes(x.r.st);if(c==='study'){const m=mins(x);o.study+=m;const n=x.r.rn||x.a.name;o.subj[n]=(o.subj[n]||0)+m}
if(c==='prayer'){o.prT++;if(ok)o.pr++}if(c==='food'){o.mealT++;if(ok)o.meal++}if(c==='quran'&&ok)o.q++;if(x.r.st==='skip'||x.r.st==='miss')o.sk++});
items(dt).forEach(x=>{if(x.r.rs||x.r.st==='resched')o.rs++});o.pct=o.tot?Math.round(o.done/o.tot*100):0;return o}
function back(n){const d=pd(today);d.setDate(d.getDate()-n);return ymd(d)}
function streak(f){let n=0,i=0;if(!f(dayStats(today)))i=1;for(;i<400;i++){const dt=back(i);if(dt<'2000')break;if(f(dayStats(dt)))n++;else break}return n}
/* modal */
function modal(title,fields,ok,okLabel){const o=document.createElement('div');o.className='ov';
o.innerHTML='<div class="mo"><h2>'+title+'</h2>'+fields.map(f=>{let i;if(f.t==='select')i='<select id="f_'+f.k+'">'+f.o.map(p=>'<option value="'+p[0]+'"'+(p[0]==f.v?' selected':'')+'>'+p[1]+'</option>').join('')+'</select>';
else if(f.t==='days')i='<div class="dys">'+['S','M','T','W','T','F','S'].map((d,j)=>'<label><input type="checkbox" class="dy" value="'+j+'"'+((f.v||[]).includes(j)?' checked':'')+'>'+d+'</label>').join('')+'</div>';
else i='<input id="f_'+f.k+'" type="'+(f.t||'text')+'" value="'+(f.v==null?'':String(f.v).replace(/"/g,'&quot;'))+'">';return'<label>'+f.l+i+'</label>'}).join('')+'<div class="acts"><button class="b p" id="mok">'+(okLabel||'Save')+'</button><button class="b" id="mx">Cancel</button></div></div>';
document.body.appendChild(o);const c=()=>o.remove();$('#mx').onclick=c;o.onclick=e=>{if(e.target===o)c()};
$('#mok').onclick=()=>{const v={};fields.forEach(f=>{if(f.t==='days')v[f.k]=[...o.querySelectorAll('.dy:checked')].map(x=>+x.value);else v[f.k]=$('#f_'+f.k).value});if(ok(v)!==false)c()}}
const catOpts=Object.entries(CAT);
function editAct(id){const a=id?S.acts.find(x=>x.id===id):{name:'',cat:'study',date:cur,s:'09:00',e:'',rem:S.set.rem,rep:[],notes:'',pri:'normal'};
modal(id?'Edit activity':'New activity',[{k:'name',l:'Name',v:a.name},{k:'cat',l:'Category',t:'select',o:catOpts,v:a.cat},{k:'date',l:'Date (start date if repeating)',t:'date',v:a.date},{k:'s',l:'Start time',t:'time',v:a.s},{k:'e',l:'End time (optional)',t:'time',v:a.e},{k:'rem',l:'Reminder, minutes before (blank = none)',t:'number',v:a.rem},{k:'rep',l:'Repeat on (none = once, all = every day)',t:'days',v:a.rep},{k:'pri',l:'Priority',t:'select',o:[['low','Low'],['normal','Normal'],['high','High']],v:a.pri},{k:'notes',l:'Notes',v:a.notes}],v=>{
if(!v.name.trim()||!v.s){alert('Name and start time are required.');return false}
const n={...a,id:a.id||'a'+Date.now(),name:v.name.trim(),cat:v.cat,date:v.date,s:v.s,e:v.e,rem:v.rem===''?null:+v.rem,rep:v.rep,pri:v.pri,notes:v.notes};
if(id)S.acts[S.acts.findIndex(x=>x.id===id)]=n;else S.acts.push(n);save();render()})}
function hist(dt,id,t){R(dt,id).h.push(t)}
function act(k,id){const dt=cur,a=S.acts.find(x=>x.id===id),r=R(dt,id),x=items(dt).find(y=>y.a.id===id),nm=r.rn||a.name;
const setSt=st=>{if(['done','late'].includes(st)&&!r.a1)r.a1=dt===today?nowT():x.s;if(st==='todo'){r.a1=null;r.a2=null}r.st=st};
if(k==='done'||k==='late'||k==='miss'){setSt(r.st===k?'todo':k)}
else if(k==='skip')setSt(r.st==='skip'?'todo':'skip');
else if(k==='start'){if(!r.a1)r.a1=nowT();r.t0=Date.now();r.st='prog'}
else if(k==='pause'){r.secs=secs(r);r.t0=0}
else if(k==='stop'){r.secs=secs(r);r.t0=0;r.a2=nowT();r.st='done'}
else if(k==='del'){if(!confirm('Delete "'+nm+'"?'))return;if(a.rep&&a.rep.length&&confirm('Delete every day? OK = all days, Cancel = only this day')){S.acts=S.acts.filter(y=>y.id!==id)}else if(a.rep&&a.rep.length){(a.xd=a.xd||[]).push(dt)}else S.acts=S.acts.filter(y=>y.id!==id)}
else if(k==='edit')return editAct(id);
else if(k==='re')return modal('Reschedule '+nm,[{k:'d',l:'New date',t:'date',v:dt},{k:'s',l:'New start',t:'time',v:x.s},{k:'e',l:'New end',t:'time',v:x.e},{k:'why',l:'Reason (optional)'}],v=>{
if(!v.s){alert('Pick a start time.');return false}const old=f12(x.s)+(x.e?'–'+f12(x.e):''),nw=f12(v.s)+(v.e?'–'+f12(v.e):'');
if(v.d===dt){if(!r.os)r.os=old;r.s=v.s;r.e=v.e;r.rs=true;hist(dt,id,'Rescheduled '+old+' → '+nw+(v.why?' ('+v.why+')':''))}
else{r.st='resched';hist(dt,id,'Moved to '+v.d+' '+nw+(v.why?' ('+v.why+')':''));S.acts.push({...a,id:'a'+Date.now(),date:v.d,s:v.s,e:v.e,rep:[],xd:[],notes:'Rescheduled from '+dt})}
save();render()},'Reschedule');
else if(k==='rp')return modal('Replace '+nm,[{k:'n',l:'Replace with',v:''},{k:'c',l:'Category',t:'select',o:catOpts,v:a.cat},{k:'why',l:'Reason',v:'Schedule changed'}],v=>{if(!v.n.trim()){alert('Enter a name.');return false}hist(dt,id,'Replaced '+nm+' with '+v.n.trim()+' ('+v.why+')');r.rn=v.n.trim();r.rc=v.c;save();render()},'Replace');
save();render()}
function card(x){const a=x.a,r=x.r,c=r.rc||a.cat,nm=r.rn||a.name,run=!!r.t0;let sub=[];
const tm=f12(x.s)+(x.e?'<br>'+f12(x.e):'');
if(x.e&&!r.secs)sub.push('Planned: '+dur(mm(x.e)-mm(x.s)));
if(r.rn)sub.push('<s>'+a.name+'</s> replaced');
if(r.secs||run)sub.push('<b data-t="'+(r.secs||0)+'|'+(r.t0||0)+'">⏱ '+fmt(secs(r))+'</b>');
if(r.a1){let d=mm(r.a1)-mm(x.s);sub.push('Actual: '+f12(r.a1)+(r.a2?'–'+f12(r.a2):'')+(d>0?' · Delayed '+d+'m':''))}
if(r.secs&&x.e)sub.push('Actual '+dur(r.secs/60)+' of '+dur(mm(x.e)-mm(x.s)));
const pr=c==='prayer',B=(k,l,cls)=>'<button class="b '+(cls||'')+'" onclick="act(\''+k+'\',\''+a.id+'\')">'+l+'</button>';
let b=pr?B('done','✓ Prayed',r.st==='done'?'p':'')+B('late','🕐 Late',r.st==='late'?'p':'')+B('miss','⏭ Missed',r.st==='miss'?'p':''):B('done','✓ Done',r.st==='done'?'p':'');
if(!pr&&(c==='study'||c==='quran'||c==='class'||c==='work'||c==='health'))b+=run?B('pause','⏸')+B('stop','⏹ Stop','p'):B('start','▶ '+(r.secs?'Resume':'Start'));
b+=B('edit','✏')+B('re','↪')+B('rp','🔄')+(pr?'':B('skip','⏭'))+B('del','🗑');
return'<div class="card it '+r.st+'"><div class="tm">'+tm+'</div><div class="bd"><button class="chip" onclick="act(\''+a.id+'\'==0?0:\'done\',\''+a.id+'\')">'+ST[r.st]+'</button><div class="nm">'+IC[c]+' '+nm+'</div><div class="sub">'+sub.join(' · ')+'</div>'+(r.os?'<div class="hist">Original: '+r.os+' → Changed to '+f12(x.s)+(x.e?'–'+f12(x.e):'')+' · ↪ Rescheduled</div>':'')+(r.h||[]).filter(h=>!h.startsWith('Rescheduled')||!r.os).map(h=>'<div class="hist">'+h+'</div>').join('')+'<div class="acts">'+b+'</div></div></div>'}
const fmt=s=>{s=Math.floor(s);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}
function dnav(){const d=pd(cur),t=d.toLocaleDateString(undefined,{day:'numeric',month:'long',year:cur===today?undefined:'numeric'});
return'<div class="bar"><button class="b" onclick="go(-1)">‹</button><h1>'+(cur===today?'TODAY — ':'')+t.toUpperCase()+'</h1><button class="b" onclick="go(1)">›</button></div>'+(cur!==today?'<div class="sub">Editing past/future day · <a href="#" onclick="cur=today;render();return false">Back to today</a></div>':'')}
function go(n){const d=pd(cur);d.setDate(d.getDate()+n);cur=ymd(d);render()}
function sumCard(dt){const s=dayStats(dt),L=items(dt),pl=L.filter(x=>x.r.st==='done'&&x.e&&x.r.secs).reduce((t,x)=>t+mm(x.e)-mm(x.s),0),ac=L.reduce((t,x)=>t+(x.r.secs?x.r.secs/60:0),0);
return'<div class="card"><b>Summary</b><div class="bar2" style="margin:8px 0"><i style="width:'+s.pct+'%"></i></div><div class="sum"><div><b>'+s.done+' / '+s.tot+'</b><span>Completed ('+s.pct+'%)</span></div><div><b>'+dur(s.study)+'</b><span>Study</span></div><div><b>'+s.pr+' / '+s.prT+'</b><span>Prayer</span></div><div><b>'+s.meal+' / '+s.mealT+'</b><span>Meals</span></div><div><b>'+s.rs+'</b><span>Rescheduled</span></div><div><b>'+s.sk+'</b><span>Skipped</span></div></div>'+
(ac?'<div class="sub" style="margin-top:8px">Timed: planned '+dur(pl)+' · actual '+dur(ac)+'</div>':'')+(Object.keys(s.subj).length?'<div style="margin-top:8px">'+Object.entries(s.subj).map(([k,v])=>'<div class="row"><span>📚 '+k+'</span><span>'+dur(v)+'</span></div>').join('')+'</div>':'')+'</div>'}
function pct(n,t){return t?Math.round(n/t*100):0}
function range(n){let o={study:0,done:0,pct:0,pr:0,prT:0,days:0,subj:{},best:null,tot:0};for(let i=0;i<n;i++){const dt=back(i),s=dayStats(dt);if(!s.tot)continue;o.days++;o.study+=s.study;o.done+=s.done;o.tot+=s.tot;o.pr+=s.pr;o.prT+=s.prT;if(!o.best||s.pct>o.best.p)o.best={p:s.pct,d:dt};for(const k in s.subj)o.subj[k]=(o.subj[k]||0)+s.subj[k]}return o}
function stats(){const w=range(7),mo=range(30),top=o=>Object.entries(o.subj).sort((a,b)=>b[1]-a[1])[0],sk=[['🔥 Overall',streak(s=>s.tot&&s.pct>=70)],['📚 Study',streak(s=>s.study>0)],['🕌 Prayer',streak(s=>s.prT&&s.pr===s.prT)],["📖 Qur'an",streak(s=>s.q>0)]];
return'<h1>Statistics</h1>'+sumCard(today)+'<div class="card"><b>Streaks</b>'+sk.map(k=>'<div class="row"><span>'+k[0]+'</span><b>'+k[1]+' days</b></div>').join('')+'<div class="sub">A day counts when it meets its goal. Skipped days break the streak.</div></div>'+
'<div class="card"><b>Last 7 days</b><div class="row"><span>Study</span><b>'+dur(w.study)+'</b></div><div class="row"><span>Avg completion</span><b>'+pct(w.done,w.tot)+'%</b></div><div class="row"><span>Prayer rate</span><b>'+pct(w.pr,w.prT)+'%</b></div><div class="row"><span>Best day</span><b>'+(w.best?pd(w.best.d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+' ('+w.best.p+'%)':'–')+'</b></div><div class="row"><span>Top subject</span><b>'+(top(w)?top(w)[0]+' ('+dur(top(w)[1])+')':'–')+'</b></div></div>'+
'<div class="card"><b>Last 30 days</b><div class="row"><span>Study</span><b>'+dur(mo.study)+'</b></div><div class="row"><span>Completed activities</span><b>'+mo.done+'</b></div><div class="row"><span>Avg daily completion</span><b>'+pct(mo.done,mo.tot)+'%</b></div><div class="row"><span>Best streak (current)</span><b>'+streak(s=>s.tot&&s.pct>=70)+' days</b></div></div>'}
function cal(){const d=pd(cur),y=d.getFullYear(),mo=d.getMonth(),n=new Date(y,mo+1,0).getDate(),f=new Date(y,mo,1).getDay();let g=['S','M','T','W','T','F','S'].map(x=>'<div style="background:none;color:var(--mut)">'+x+'</div>').join('')+'<div></div>'.repeat(f);
for(let i=1;i<=n;i++){const dt=y+'-'+pad(mo+1)+'-'+pad(i),s=dayStats(dt),op=s.tot&&dt<=today?.25+s.pct/140:0;g+='<div onclick="cur=\''+dt+'\';tab(\'today\')" style="'+(dt===cur?'outline:2px solid var(--ac);':'')+(op?'background:color-mix(in srgb,var(--ac) '+Math.round(op*100)+'%,var(--bg))':'')+'">'+i+'</div>'}
return'<div class="bar"><button class="b" onclick="cur=ymd(new Date(cur.slice(0,4),+cur.slice(5,7)-2,1));render()">‹</button><h1>'+d.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</h1><button class="b" onclick="cur=ymd(new Date(cur.slice(0,4),+cur.slice(5,7),1));render()">›</button></div><div class="card"><div class="grid">'+g+'</div><div class="sub" style="margin-top:8px">Tap a date to see or edit that day. Darker = more completed.</div></div>'+sumCard(cur)}
function settings(){return'<h1>Settings</h1><div class="card"><label>Theme<select onchange="S.set.theme=this.value;save();applyTheme()">'+[['sys','📱 System'],['light','☀ Light'],['dark','🌙 Dark']].map(o=>'<option value="'+o[0]+'"'+(S.set.theme===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label><label>Default reminder (minutes before)<input type="number" value="'+S.set.rem+'" onchange="S.set.rem=+this.value;save()"></label></div>'+
'<div class="card"><b>Notifications</b><div class="sub">Reminders ring like an alarm with a full-screen popup, even when the app is closed. Tap to re-check permissions.</div><div class="acts"><button class="b p" onclick="askN()">Enable / refresh reminders</button></div></div>'+
'<div class="card"><b>Prayer & meal times</b><div class="sub">Tap ✏ on any prayer or meal to set its time. Edits apply to every day; use ↪ to change a single day.</div></div>'+
'<div class="card"><b>Backup</b><div class="acts"><button class="b" onclick="exp()">Export JSON</button><button class="b" onclick="$(\'#imp\').click()">Import JSON</button><button class="b" style="color:var(--bad)" onclick="if(confirm(\'Erase ALL data?\')){S=seed();save();render()}">Reset data</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"></div>'+
'<div class="card"><b>About</b><div class="sub">My Daily Tracker · all data stays on this device. Install: browser menu → Add to Home screen.</div></div>'}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='daily-tracker-'+today+'.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.acts||!d.rec)throw 0;S=d;S.set=S.set||{theme:'sys',rem:10};S.fired=S.fired||{};save();applyTheme();render();alert('Imported.')}catch(e){alert('Not a valid backup file.')}})}
function askN(){if(isNative)return nativeSync(true);if(!('Notification'in window))return alert('Notifications are not supported in this browser.');Notification.requestPermission().then(p=>alert(p==='granted'?'Notifications enabled.':'Permission not granted. Allow notifications in browser settings.'))}
function wkTog(dt,id){const r=R(dt,id);if(r.st==='done'){r.st='todo';r.a1=null}else{r.st='done';r.a1=r.a1||(dt===today?nowT():S.acts.find(a=>a.id===id).s)}save();render()}
function wkGo(n){const d=pd(cur);d.setDate(d.getDate()+7*n);cur=ymd(d);render()}
function week(){const d=pd(cur),o=(d.getDay()+6)%7,days=[0,1,2,3,4,5,6].map(i=>{const x=new Date(d);x.setDate(d.getDate()-o+i);return ymd(x)}),ids=days.map(t=>items(t));
const rows=S.acts.filter(a=>ids.some(l=>l.some(x=>x.a.id===a.id))).sort((a,b)=>mm(a.s)-mm(b.s));
const N=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let h='<div class="bar"><button class="b" onclick="wkGo(-1)">‹</button><h1>Week of '+pd(days[0]).toLocaleDateString(undefined,{day:'numeric',month:'short'})+'</h1><button class="b" onclick="wkGo(1)">›</button></div><div class="sub">Tap a box to tick it for that day.</div><div class="card wk"><table><tr><th>Time</th><th>Activity</th>'+N.map((n,i)=>'<th'+(days[i]===today?' style="color:var(--ac)"':'')+'>'+n+'<br><small>'+days[i].slice(8)+'</small></th>').join('')+'</tr>';
rows.forEach(a=>{h+='<tr><td class="t">'+f12(a.s)+'</td><td class="n">'+IC[a.cat]+' '+a.name+'</td>'+days.map((t,i)=>{const x=ids[i].find(y=>y.a.id===a.id);if(!x)return'<td style="color:var(--ln)">–</td>';return'<td class="cl" onclick="wkTog(\''+t+'\',\''+a.id+'\')">'+({done:'✅',late:'🕐',skip:'⏭',miss:'❌',resched:'↪'}[x.r.st]||'⬜')+'</td>'}).join('')+'</tr>'});
h+='<tr><td></td><td class="n">Done</td>'+days.map(t=>'<td><b>'+dayStats(t).pct+'%</b></td>').join('')+'</tr></table></div>';return h}
function tab(v){view=v;render()}
function render(){document.querySelectorAll('.tab button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));$('#fab').style.display=view==='today'?'':'none';let h;
if(view==='today'){const L=items(cur);h=dnav()+sumCard(cur)+(L.length?L.map(card).join(''):'<div class="card">Nothing planned. Tap + to add an activity.</div>')}
else if(view==='week')h=week();else if(view==='cal')h=cal();else if(view==='stats')h=stats();else h=settings();$('#m').innerHTML=h;save()}
document.querySelectorAll('.tab button').forEach(b=>b.onclick=()=>tab(b.dataset.v));
setInterval(()=>{document.querySelectorAll('[data-t]').forEach(e=>{const[s,t]=e.dataset.t.split('|').map(Number);e.textContent='⏱ '+fmt(s+(t?(Date.now()-t)/1000:0))})},1000);
function remind(){if(isNative)return;const n=new Date(),m=n.getHours()*60+n.getMinutes();S.fired=S.fired||{};items(today).forEach(x=>{const a=x.a;if(a.rem==null||['done','late','skip','miss','resched'].includes(x.r.st))return;const k=today+a.id+x.s;if(S.fired[k]||mm(x.s)-a.rem!==m)return;S.fired[k]=1;save();const msg=a.cat==='prayer'?a.name+' prayer time.':a.cat==='food'?a.name+' time.':(x.r.rn||a.name)+(a.rem?' starts in '+a.rem+' minutes.':' starts now.');
try{if(Notification.permission==='granted')new Notification(IC[a.cat]+' '+(x.r.rn||a.name),{body:msg,tag:k})}catch(e){}})}
setInterval(remind,20000);const isNative=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
function remMsg(a,x){return a.cat==='prayer'?a.name+' prayer time.':a.cat==='food'?a.name+' time.':(x.r.rn||a.name)+(a.rem?' starts in '+a.rem+' minutes.':' starts now.')}
async function nativeSync(ask){if(!isNative)return;const C=window.Capacitor,LN=C.Plugins&&C.Plugins.LocalNotifications;
try{if(LN){let p=await LN.checkPermissions();if(p.display!=='granted')p=await LN.requestPermissions();if(p.display!=='granted'){if(ask)alert('Notifications are blocked. Allow them in Android Settings > Apps > My Daily Tracker.');return}}
if(ask)try{await C.nativePromise('DailyAlarm','allowFullScreen',{})}catch(e){}
const list=[],now=Date.now(),t0=ymd(new Date());let id=1;
for(let i=0;i<7;i++){const d=pd(t0);d.setDate(d.getDate()+i);const dt=ymd(d);
items(dt).forEach(x=>{const a=x.a;if(a.rem==null||['done','late','skip','miss','resched'].includes(x.r.st))return;const[hh,mi]=x.s.split(':').map(Number);const at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,mi-a.rem).getTime();if(at<=now)return;
list.push({id:id++,at:at,t:IC[x.r.rc||a.cat]+' '+(x.r.rn||a.name),b:remMsg(a,x)})})}
await C.nativePromise('DailyAlarm','schedule',{items:list});if(ask)alert(list.length+' alarms set for the next 7 days.')}catch(e){if(ask)alert('Could not set alarms: '+e)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)nativeSync()});
applyTheme();render();
if(!isNative&&'serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
